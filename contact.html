<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Anjani | contact</title>
 <link rel="stylesheet" href="style.css">
</head>

<body>
 <section id="contact">
  <h1>Contact Me</h1>
  <div>
   <a href="mailto:anjani.alaveni@gmail.com">Email</a>
   <a href="https://github.com/anjani-alaveni" target="_blank">GitHub</a>
   <a href="https://www.linkedin.com/in/anjani-alaveni" target="_blank">LinkedIn</a>
  </div>
  <form action="https://formspree.io/f/xeaqojjg" method="POST" id="contactForm">
   <label for="name">Name</label>
   <input type="text" id="name" name="name" placeholder="Enter Your Name">

   <label for="email">Email</label>
   <input type="email" id="email" name="email" placeholder="Enter your Email">

   <label for="subject">Subject</label>
   <input type="text" id="subject" name="subject" placeholder="Enter Subject">

   <label for="message">Message</label>
   <textarea id="message" name="message" rows="5" placeholder="Enter Message"></textarea>

   <button type="Submit" class="submitbtn">Send Message</button>
  </form>
 </section>
 
 <script src="script.js"></script>
</body>

</html>
